name: Promote to production

# Pushing a semver tag `vX.Y.Z` -> https://app.sfere.io (Firebase Hosting site
# `sfere-app`). Tags are created by `pnpm release` (scripts/release.mjs), never by
# hand — the parity check below enforces that.
#
# The `production` GitHub Environment carries a required reviewer, so this pauses
# for manual approval before anything reaches the live site.
#
# This DOES rebuild, where the backend's promote.yml deliberately does not. It has
# to: VITE_API_BASE is compiled into the bundle, so the production artifact cannot
# be the staging one. The lockfile is frozen and the tag pins the source, so the
# only intended difference from the staging build of the same commit is the API
# host and the stamped version.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver tag to promote, e.g. v0.2.0'
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.sfere.io
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate the version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VTAG="${{ inputs.version }}"
          else
            VTAG="${GITHUB_REF_NAME}"
          fi
          case "$VTAG" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::Version '$VTAG' is not a vX.Y.Z semver tag."; exit 1 ;;
          esac
          # The tag and package.json must agree, or the version the app displays is
          # not the version that was released.
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$VTAG" ]; then
            echo "::error::Tag $VTAG does not match package.json ($PKG). Cut releases with 'pnpm release', never by hand."
            exit 1
          fi
          echo "VTAG=$VTAG" >> "$GITHUB_ENV"

      # The production backend does not exist yet: k8s/overlays/production in the
      # backend repo still carries REPLACE_ placeholders and has never been applied.
      # Shipping a dashboard whose every API call fails DNS is worse than not
      # shipping — the app renders, sign-in works (Identity Platform is not behind
      # this host), and every screen is quietly empty. Fail loudly here instead.
      - name: Preflight — the production API must answer
        run: |
          if ! curl -fsS --max-time 10 "${{ vars.VITE_API_BASE }}/healthz" > /dev/null; then
            echo "::error::${{ vars.VITE_API_BASE }}/healthz did not answer. Complete and deploy the backend's k8s/overlays/production before promoting the dashboard."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }} # https://api.sfere.io
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DEFAULT_TENANT_ID: ${{ vars.VITE_FIREBASE_DEFAULT_TENANT_ID }}
          VITE_JITSU_HOST: ${{ vars.VITE_JITSU_HOST }}
          VITE_JITSU_WRITE_KEY: ${{ secrets.VITE_JITSU_WRITE_KEY }}
          VITE_EVENTS_WORKSPACE_ID: ${{ vars.VITE_EVENTS_WORKSPACE_ID }}
          VITE_EVENTS_ACTOR_ID: ${{ vars.VITE_EVENTS_ACTOR_ID }}
          VITE_APP_VERSION: ${{ env.VTAG }}
          VITE_GIT_SHA: ${{ github.sha }}

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Deploy to the production site
        run: |
          npx --yes firebase-tools@15.24.0 deploy \
            --only "hosting:${{ vars.FIREBASE_SITE_PROD }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --message "${{ env.VTAG }} (${{ github.sha }}) by ${{ github.actor }}" \
            --non-interactive
