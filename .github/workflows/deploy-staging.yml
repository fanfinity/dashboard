name: Deploy to staging

# Push to main -> https://app-staging.sfere.io (Firebase Hosting site `sfere-stg`
# in koratona-9791a). This replaced deploy-pages.yml; the dashboard is no longer
# on GitHub Pages.
#
# Unlike marketing/website's pipeline this does NOT build once and fan the artifact
# out to several deploy jobs. VITE_API_BASE is compiled into the bundle at build
# time (src/api/mutator.js), so staging and production are genuinely different
# bytes and each trigger builds its own. Do not "optimise" this into a shared build
# job — it would ship the staging API host to production.
#
# Auth is keyless: Workload Identity Federation mints a short-lived token for
# gh-deployer-dashboard. There is no service-account JSON in this repo or in
# GitHub secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: firebase-hosting-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://app-staging.sfere.io
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build
        env:
          # VITE_API_BASE is the ONLY value that differs between environments; it
          # is an Environment variable, everything below is repository-level.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DEFAULT_TENANT_ID: ${{ vars.VITE_FIREBASE_DEFAULT_TENANT_ID }}
          # Mirrors the backend's staging APP_VERSION (sha-<short>), so the version
          # in the dashboard's account menu and GET /version are comparable.
          VITE_APP_VERSION: sha-${{ env.SHORT_SHA }}
          VITE_GIT_SHA: ${{ github.sha }}

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Deploy to the staging site
        # `--only hosting:<site>` resolves against the `site:` keys in
        # firebase.json. Without it BOTH sites — including production — release.
        run: |
          npx --yes firebase-tools@15.24.0 deploy \
            --only "hosting:${{ vars.FIREBASE_SITE_STAGING }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --message "${{ github.sha }} by ${{ github.actor }}" \
            --non-interactive

      # The repo's only behavioural gate, now pointed at the real deployed origin
      # rather than a local static server. It walks every route in the screen
      # manifest and fails on a console error, an ErrorState or a missing <h1>.
      # A red run here means the release is already live and bad — roll back with
      #   firebase hosting:clone sfere-stg:<versionId> sfere-stg:live
      - name: Install Chromium for the smoke walk
        run: npx playwright install --with-deps chromium

      - name: Smoke test the deployed site
        run: node scripts/smoke.mjs
        env:
          SMOKE_BASE: https://app-staging.sfere.io
          # Backend base, so smoke.mjs can self-provision the smoke account after a
          # greenfield reset (ensureSmokeAccount) — same value the build compiles in.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
