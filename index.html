<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />
    <!-- The allowlist IS the "backend and nothing else" rule, enforced rather
         than documented: the Sfere API (local / staging / prod) plus Identity
         Platform for sign-in, and no third party at all. `img-src` is 'self'
         only — connector logos are served by our own API now, so a card that
         tries to load one from a vendor host is blocked here, not merely
         discouraged. Adding a host back is a deliberate decision, not a
         config detail. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://api.sfere.io https://api-staging.sfere.io https://api.fanfinity.io https://api-staging.fanfinity.io https://identitytoolkit.googleapis.com https://securetoken.googleapis.com<% if (ctx.dev) { %> ws://localhost:* http://localhost:8080<% } %>;<% if (ctx.dev) { %> worker-src 'self' blob:;<% } %>"
    />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/ico" href="favicon.ico" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
