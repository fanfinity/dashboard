  # ------------------------------------------------------------------ Events
  # The dashboard has no connection to any event-collection vendor. It asks
  # this API for events; the backend owns whatever upstream produces them and
  # returns records in the flat, vendor-neutral shape below. Anything that
  # names the upstream (its ingest envelope, its internal ids, its wire
  # format) is the backend's to absorb and must not surface here.
  /v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: Incoming events for one stream
      description: >-
        Backs useLiveEvents() — the Live Events feed. Cursor-paginated and
        filterable. `end` doubles as the "load previous" cursor: the page
        re-requests with `end` set to the oldest event it already holds.
      parameters:
        - name: streamId
          in: query
          required: true
          description: Which event stream (site) to read. See GET /v1/event-streams.
          schema: { type: string }
        - name: level
          in: query
          description: Omit or send `all` for everything; `error` narrows to failures.
          schema: { type: string, enum: [all, error], default: all }
        - name: start
          in: query
          schema: { type: string, format: date-time }
        - name: end
          in: query
          schema: { type: string, format: date-time }
        - name: search
          in: query
          description: Free-text match across page URL, user id, email and payload.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveEventList' }
