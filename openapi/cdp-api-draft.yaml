openapi: 3.1.0
info:
  title: Sfere CDP API (draft)
  version: 0.1.0
  description: |
    Proposed API for the modules the dashboard has already built against mock
    JSON in `public/data/`. This is a draft handed to the backend team to build
    against — it is NOT pulled by `pnpm openapi` (that command only regenerates
    `openapi/fanfinity-api.json`, the accounts/RBAC spec, from staging) and it is
    NOT wired into any codegen today. Once real endpoints exist, this file (or
    its merged descendant) becomes the input to a second orval client, and the
    frontend composables currently reading `useMockResource(...)` switch to it
    one at a time.

    Scope: every module `enabled: true` in `src/config/features.js` as of this
    draft — Dashboard, Sources, Destinations, Pipes, Settings, Warehouse
    connections, Monitoring (Errors + Health), Profiles (search), Secrets and
    Authorizations — Live Events included. The dashboard talks to this API and
    to nothing else: where an event stream is actually hosted (Jitsu today) is
    the backend's business, and `GET /v1/events` is deliberately specified as
    an already-flattened, vendor-neutral record rather than a passthrough of
    any upstream wire format. Two modules are enabled but only partly
    built: Warehouse and Profiles each gate several child screens behind their
    own still-`false` feature key (DWH syncs, Warehouse models, Identity
    resolution, Attributes, Profile API, Live/DWH profile syncs) — those are
    deliberately excluded and belong in a follow-up draft once their screens
    are worth building a backend for.

    Every schema below was written by reading the actual mock JSON in
    `public/data/*.json`, not guessed — field names, nullability and enum
    values match the fixtures the frontend already renders.

    ## What is already built — do NOT implement these from this file

    Sources, Destinations and Pipes have since SHIPPED on the real backend, in
    a different shape from the one drafted here: account-scoped
    (`/v1/accounts/{account_id}/sources`), snake_case, page-numbered rather
    than cursor-paginated, and "pipes" are called `pipelines`. The authority
    for those three is `openapi/fanfinity-api.json`, pulled from staging by
    `pnpm openapi`, and the frontend already reads and writes them there
    (`useSources`, `useDestinations`, `usePipes`, plus the `*API` composables
    for creates).

    Their drafted paths are deliberately LEFT in this file rather than
    deleted, because the field sets differ: the drafted records carry things
    the real ones do not yet (`eventCountLastHour`, `pipeCount`,
    `deliveryCountLastHour`, template versions, the `destinationParams` a pipe
    carries). Read those as the outstanding ask for those domains, not as an
    endpoint to build. Everything else here — the dashboard snapshot, events,
    connectors, trash, errors, secrets, authorizations and the rest — has no
    real endpoint at all, and a screen reading one shows "No API yet" until it
    does.

    ## Versioning

    URI-versioned — every path is prefixed `/v1/`, and that prefix is the
    entire versioning story for this draft. A breaking change (removing a
    field, changing a type, changing what a status code means) gets a new
    `/v2/` prefix living alongside `/v1/`, never an in-place change to `/v1/`.
    A non-breaking change (a new optional field, a new endpoint, a new enum
    value additive to existing handling) ships straight into `/v1/`, no
    version bump needed. `/v1/` stays live until it is explicitly deprecated
    with advance notice — there is no sunset mechanism in this draft because
    there is no `/v2/` yet to deprecate it in favor of; add one (e.g.
    `Deprecation`/`Sunset` response headers) when that day comes, not before.

    ## Pagination

    Every list endpoint is cursor-paginated: request `?cursor=<opaque
    string>&limit=<n>` (both optional — omit `cursor` for the first page,
    omit `limit` for the server default), response is `{ items: [...],
    nextCursor, hasMore }`. Cursor beats page-number here because several of
    these lists change while being read (errors, profiles) — a page number
    can skip or repeat rows when rows are inserted between two requests; an
    opaque cursor anchored to the last-seen row cannot. `nextCursor` is
    `null` exactly when `hasMore` is `false`; a client should stop once
    `nextCursor` is `null`, not once a page comes back short.

    Three endpoints deliberately do NOT follow this and say why at the point
    of use: `GET /v1/dashboard`, `GET /v1/pipes/diagram`, `GET /v1/error-stats`
    and `GET /v1/workspace` return a single snapshot object, not a list, so
    there is nothing to paginate. `GET /v1/trash` is paginated only when its
    `resource` filter narrows to one kind — the unfiltered, all-three-kinds
    view stays a single unpaginated object because `usePipesTrash()` needs
    the complete graph in one response to resolve cascade state (a trashed
    pipe pointing at a trashed source has to see both at once).

    ## Idempotency

    Every resource-creating `POST` (sources, destinations, pipes, dwh
    connections, secrets, api tokens, member invites) requires an
    `Idempotency-Key` header — see `components.parameters.IdempotencyKey`.
    Retrying the same create with the same key returns the original 2xx
    response rather than creating a second resource, which is what makes a
    network-level retry after a dropped response safe. Reusing a key with a
    materially different body is a `409` (`components.responses.
    IdempotencyConflict`). `PATCH`/`DELETE` and action endpoints like restore
    are left out on purpose — repeating any of them already converges to the
    same end state, so there is nothing an idempotency key would additionally
    protect.

    ## Errors and standardization

    Every non-2xx response across every endpoint is the same
    `components.schemas.Problem` shape (RFC 9457 `problem+json`), extended
    with two fields a real client needs that the bare RFC doesn't provide: a
    stable machine-readable `code` (switch on this, never on `title`/
    `detail` — those are human copy and are free to reword) and a
    `requestId` for correlating a bug report against backend logs. A `422`
    validation failure additionally carries `errors: [{ field, message }]`.
    Success bodies are deliberately NOT wrapped in a matching envelope —
    `GET /v1/sources/{id}` returns a bare `Source`, not `{ data: Source }` —
    because the field that actually needed standardizing for a real client
    was error handling (one shape, one place to parse it), and wrapping
    every successful body too would be a bigger break from how the frontend
    composables already read responses for no matching benefit.

  contact:
    name: Sfere Dashboard (frontend)

servers:
  - url: http://localhost:8080
    description: Local backend dev (mirrors src/api/mutator.js's default)
  - url: https://api-staging.sfere.io
    description: Staging (VITE_API_BASE) — the one host this app calls

security:
  - bearerAuth: []

tags:
  - name: Dashboard
  - name: Events
  - name: Sources
  - name: Destinations
  - name: Pipes
  - name: Trash
  - name: Settings
  - name: Warehouse
  - name: Monitoring
  - name: Profiles
  - name: Secrets
  - name: Authorizations

paths:
  # ---------------------------------------------------------------- Dashboard
  /v1/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Home screen stats, series and recent activity
      description: >-
        Backs useDashboardHome.js / dashboard.json. One object: counts,
        hourly rates, five named time series (each an array of buckets with
        per-key numeric fields, shape varies by series — see
        DashboardSeriesPoint), a chart-color config per series, and the last
        few raw events/profiles for the activity feed. A single snapshot,
        not a list — not paginated.
