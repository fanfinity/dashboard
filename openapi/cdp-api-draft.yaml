        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Pipes]
      operationId: updatePipe
      summary: Update a pipe
      description: >-
        Backs usePipes().setEnabled() today (isEnabled only); the request body
        is written open in case editable fields grow beyond that. No
        Idempotency-Key, matching updateSource/updateDestination — repeating
        the same patch converges to the same state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isEnabled: { type: boolean }
                name: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pipe' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Pipes]
      operationId: deletePipe
      summary: Soft-delete a pipe (moves it to trash)
      description: Backs usePipes().remove(); see the Trash endpoints below.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /v1/pipes/diagram:
    get:
      tags: [Pipes]
      operationId: getPipesDiagram
      summary: Sources, destinations and pipes as one flow graph
      description: >-
        Backs useDiagram()/pipes-diagram.json — the same sources and
        destinations as their own list endpoints, pre-shaped for the flow
        view so the frontend doesn't have to join three collections
        client-side on every render. (`useDiagram`'s `nodes` computed still
        does its own defensive join — a pipe whose endpoint id doesn't
        resolve is dropped rather than rendered broken.) A single graph
        snapshot, not a list — not paginated, same reasoning as the
        unfiltered Trash view below.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipesDiagram' }
        default: { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------------- Trash
  /v1/trash:
    get:
      tags: [Trash]
      operationId: listTrash
      summary: Deleted sources, destinations and pipes
      description: >-
        Backs trash.json today, one file holding all three resource kinds
        together — kept as one endpoint rather than three, since
        usePipesTrash() already needs sources+destinations trash loaded
        alongside pipes trash to resolve cascade state (a deleted pipe can
        point at a source/destination that is itself deleted). Pagination
        applies only when `resource` narrows the response to one kind
        (returns `TrashList`, cursor-paginated like every other list here);
        omitting `resource` returns the full `Trash` object, unpaginated,
        because cascade resolution needs the complete cross-resource graph
        in one response rather than a partial page of it.
      parameters:
        - name: resource
          in: query
          description: Filter to one resource kind; omit for all three.
          schema: { type: string, enum: [sources, destinations, pipes] }
        - name: cursor
          in: query
          description: Only applies when `resource` is set. Ignored otherwise.
          schema: { type: string }
        - name: limit
          in: query
          description: Only applies when `resource` is set. Ignored otherwise.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: >-
            `Trash` when `resource` is omitted; `TrashList` (paginated) when
            `resource` is set.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Trash'
                  - $ref: '#/components/schemas/TrashList'
        default: { $ref: '#/components/responses/Problem' }

  /v1/trash/{resource}/{id}/restore:
    parameters:
      - name: resource
        in: path
        required: true
        schema: { type: string, enum: [sources, destinations, pipes] }
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trash]
      operationId: restoreTrashedRecord
      summary: Restore one deleted record
      description: >-
        Backs usePipesTrash().restore(). Restoring a pipe whose source or
        destination is `trashed` (not `missing`) must cascade-restore that
        record too — mirroring the frontend's cascade resolution — so this
        is refused (409) rather than silently leaving a dangling reference
        when the caller hasn't confirmed the cascade. No Idempotency-Key —
        restoring an already-restored record is naturally idempotent (it
        just returns the same restored state again), unlike the creates
        below which would otherwise create a second resource on retry.
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreResult' }
        '409':
          description: >-
            Blocked — the record references a trashed or missing
            source/destination; see `RestoreResult.cascade`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreResult' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/trash/{resource}/{id}:
    parameters:
      - name: resource
        in: path
        required: true
        schema: { type: string, enum: [sources, destinations, pipes] }
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Trash]
      operationId: purgeTrashedRecord
      summary: Purge one deleted record permanently
      description: >-
        Permanently removes one trashed record — cannot be restored
        afterward.
      responses:
        '204': { description: Purged }
        default: { $ref: '#/components/responses/Problem' }

  /v1/trash/{resource}:
    parameters:
      - name: resource
        in: path
        required: true
        schema: { type: string, enum: [sources, destinations, pipes] }
    delete:
      tags: [Trash]
      operationId: emptyTrash
      summary: Empty trash for one resource kind
      description: Backs usePipesTrash().purgeAll().
      responses:
        '204': { description: Emptied }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Settings
  /v1/workspace:
    get:
      tags: [Settings]
      operationId: getWorkspaceSettings
      summary: Workspace settings — identity, retention, identity resolution, alerts
      description: A single settings snapshot, not a list — not paginated.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSettings' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Settings]
      operationId: updateWorkspaceSettings
      summary: Update workspace name and retention windows
      description: >-
        Backs SettingsPage.vue's `save()` — today purely local, the form's
        own comment says "there is no backend behind this form."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                retention:
                  $ref: '#/components/schemas/RetentionSettings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSettings' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/members:
    get:
      tags: [Settings]
      operationId: listMembers
      summary: Active members and pending invitations
      description: >-
        `managedUsers` is cursor-paginated like every list in this spec (an
        account can accumulate hundreds of members); `pendingInvites` is
        returned in full and unpaginated — invitations expire in days and
        stay few in practice, so a second pagination axis on the same
        response isn't worth the extra query params yet.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembersPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Settings]
      operationId: inviteMember
      summary: Invite a member
      description: >-
        Backs SettingsPage.vue's inviteMember(), which today just notifies
        "needs the accounts backend" — a real call likely belongs on the
        existing accounts/RBAC API (fanfinity-api.json's
        /v1/accounts/{id}/members) rather than here, since membership is an
        account concept, not a CDP one. Listed for completeness; consider
        merging this and the two DELETEs below into that spec instead of
        this one.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [owner, admin, editor, viewer] }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingInvite' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/members/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Settings]
      operationId: removeMember
      summary: Remove a member
      description: Removes an active member from the workspace.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/invites/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Settings]
      operationId: revokeInvite
      summary: Revoke a pending invitation
      description: Revokes a pending invitation before it is accepted.
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }

  /v1/api-tokens:
    get:
      tags: [Settings]
      operationId: listApiTokens
      summary: List API tokens (preview only, never the full value)
      description: Backs the Settings → API tokens list. Cursor-paginated.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Settings]
      operationId: createApiToken
      summary: Create an API token
      description: >-
        The full token value is returned exactly once, on creation — every
        other read only ever returns `tokenPreview`, matching how
        `secrets.json`'s `valuePreview` never round-trips the real value
        either.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                description: { type: [string, 'null'] }
                scopes:
                  type: array
                  items: { type: string }
                expiresAt: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiToken'
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
                        description: Full secret value — shown once.
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/api-tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Settings]
      operationId: revokeApiToken
      summary: Revoke a token
      description: Revokes an API token; the token stops authenticating immediately.
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }

