              schema: { $ref: '#/components/schemas/Source' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Sources]
      operationId: deleteSource
      summary: Soft-delete a source (moves it to trash)
      description: Backs useSources().remove(); see the Trash endpoints below.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

