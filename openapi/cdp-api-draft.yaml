        default: { $ref: '#/components/responses/Problem' }

  /v1/error-stats:
    get:
      tags: [Monitoring]
      operationId: getErrorStats
      summary: Error counts and an hourly series by category
      description: >-
        A single aggregate snapshot (counts plus an hourly bucketed time
        series), not a list of records — not paginated. Contrast with
        `GET /v1/errors` above, which lists the underlying records.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorStats' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/health:
    get:
      tags: [Monitoring]
      operationId: getHealth
      summary: Queue depths and the async worker heartbeat log
      description: >-
        `queues` is a point-in-time snapshot; `heartbeat` is the one
        cursor-paginated field on this endpoint, paged independently via
        `heartbeatCursor`/`heartbeatLimit` rather than the top-level
        `cursor`/`limit` used elsewhere, since `GET /v1/health` as a whole is
        a snapshot object, not a list — only the heartbeat log inside it is.
      parameters:
        - name: heartbeatCursor
          in: query
          description: Pages through `heartbeat.items`. Omit for the first page.
          schema: { type: string }
        - name: heartbeatLimit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthSnapshot' }
        default: { $ref: '#/components/responses/Problem' }

  # --------------------------------------------------------------- Profiles
  /v1/profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      summary: Search/list resolved fan profiles
      description: >-
        Backs Profile search only — the one Profiles child screen whose own
        feature key is on today. Identity resolution, Attributes, Profile
        API and the two sync screens stay out of scope until their keys
        flip.
      parameters:
        - name: q
          in: query
          description: Free-text match against displayName/primaryEmail/identifiers.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileList' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/identifier-types:
    get:
      tags: [Profiles]
      operationId: listIdentifierTypes
      summary: Configured identifier types (email, user_id, browser, ...)
      description: Backs the Profiles → identifier types configuration list.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentifierTypeList' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Secrets
  /v1/secrets:
    get:
      tags: [Secrets]
      operationId: listSecrets
      summary: List secrets (preview only, never the full value)
      description: >-
        Backs the Secrets list screen; values are never returned, only
        previews.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Secrets]
      operationId: createSecret
      summary: Create a secret
      description: >-
        Creates a secret; the value is write-only and never returned by any
        GET.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: { type: string }
                description: { type: [string, 'null'] }
                value:
                  type: string
                  description: Write-only — never returned by any GET.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Secret' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/secrets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Secrets]
      operationId: deleteSecret
      summary: Delete a secret
      description: >-
        Refuse (409) when `usedByCount > 0` — matches the frontend's
        `usedBy` list, which exists so a screen can warn before deleting a
        secret a live destination still references.
      responses:
        '204': { description: Deleted }
        '409':
          description: Still referenced by usedBy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Secret' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------- Authorizations
  /v1/oauth-providers:
    get:
      tags: [Authorizations]
      operationId: listOAuthProviders
      summary: OAuth providers available to connect
      description: >-
        Backs the Authorizations screen's list of connectable OAuth
        providers.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthProviderList' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/oauth-authorizations:
    get:
      tags: [Authorizations]
      operationId: listOAuthAuthorizations
      summary: Granted OAuth authorizations
      description: >-
        Backs the Authorizations screen's list of granted OAuth
        authorizations.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthAuthorizationList' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/oauth-authorizations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Authorizations]
      operationId: revokeOAuthAuthorization
      summary: Revoke an authorization
      description: Revokes a granted OAuth authorization.
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Google Cloud Identity Platform ID token, same as the accounts/RBAC
        API — src/api/mutator.js already attaches this header and retries
        once with a force-refreshed token on 401. A client generated from
        this spec should behave identically so both backends share one
        mutator.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }

    Cursor:
      name: cursor
      in: query
      description: >-
        Opaque pagination cursor copied from a previous response's
        `nextCursor`. Omit for the first page. Never construct or parse this
        value — treat it as an opaque token.
      schema: { type: string }

    Limit:
      name: limit
      in: query
      description: Max items to return in this page.
      schema: { type: integer, default: 50, minimum: 1, maximum: 200 }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID, unique per logical create attempt. Retrying
        the same create with the same key returns the original 2xx response
        instead of creating a second resource — this is what makes a
        network-level retry after a dropped response safe. Reusing the key
        with a materially different request body is a 409 (see
        `components.responses.IdempotencyConflict`). The server should keep
        each key's original response for at least 24 hours.
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: >-
        Error — RFC 9457 problem+json, matching src/api/mutator.js's
        ApiError (status + { type, title, status, detail }), extended with
        `code`/`requestId`/`errors` — see Problem schema.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }

    IdempotencyConflict:
      description: >-
        The Idempotency-Key header was already used on a previous request
        whose body doesn't match this one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: >-
        RFC 9457 problem+json, extended with two fields a real client needs
        that the bare RFC doesn't provide: a stable machine-readable `code`
        (switch on this — `title`/`detail` are human copy, free to reword,
        and must never be string-matched) and `requestId`, for correlating
        a report against backend logs.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        code:
          type: string
          description: >-
            Stable machine-readable error code, e.g. "not_found",
            "validation_error", "idempotency_key_conflict", "conflict",
            "rate_limited", "unauthorized", "forbidden".
        requestId:
          type: string
          description: Correlates this response with backend logs.
        errors:
          type: array
          description: >-
            Field-level validation failures. Present when code is
            "validation_error"; omitted otherwise.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PageMeta:
      type: object
      description: Shared cursor-pagination fields, mixed into every *List schema.
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page; null exactly when hasMore is false.
        hasMore: { type: boolean }

    # ------------------------------------------------------------ Dashboard
    DashboardSeriesPoint:
      type: object
      description: >-
        One time-bucket. `bucket` is always present; every other key is a
        series-specific numeric field (e.g. sourceSeries has one key per
        source slug) — modeled as additionalProperties since the key set
        varies by which of the five series this point belongs to.
      properties:
        bucket: { type: string, format: date-time }
      additionalProperties: { type: number }

    ChartSeriesConfig:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        color: { type: string }

    DashboardSnapshot:
      type: object
      properties:
        updatedAt: { type: string, format: date-time }
        totalSources: { type: integer }
        totalEventDestinations: { type: integer }
        totalPipes: { type: integer }
        totalEventsLastHour: { type: integer }
        activeSourcesLastHour: { type: integer }
        activeEventTypesLastHour: { type: integer }
        activeEventStreamSourcesLastHour: { type: integer }
        activeCloudAppSourcesLastHour: { type: integer }
        activeEventDestinationsLastHour: { type: integer }
        routedEventsLastHour: { type: integer }
        failedProfileDeliveriesLastHour: { type: integer }
        activeLiveProfileSyncsLastHour: { type: integer }
        profilesRefreshedLastHour: { type: integer }
        profilesRoutedLastHour: { type: integer }
        errorsLastHour: { type: integer }
        routingRate: { type: number }
        sourceSeries:
          type: array
          items: { $ref: '#/components/schemas/DashboardSeriesPoint' }
        eventTypeSeries:
          type: array
          items: { $ref: '#/components/schemas/DashboardSeriesPoint' }
        routedSeries:
          type: array
          items: { $ref: '#/components/schemas/DashboardSeriesPoint' }
        profileRefreshSeries:
          type: array
          items: { $ref: '#/components/schemas/DashboardSeriesPoint' }
        profileDeliverySeries:
          type: array
          items: { $ref: '#/components/schemas/DashboardSeriesPoint' }
        sourceConfig:
          type: array
          items: { $ref: '#/components/schemas/ChartSeriesConfig' }
        eventTypeConfig:
          type: array
          items: { $ref: '#/components/schemas/ChartSeriesConfig' }
        routedConfig:
          type: array
          items: { $ref: '#/components/schemas/ChartSeriesConfig' }
        profileRefreshConfig:
          type: array
          items: { $ref: '#/components/schemas/ChartSeriesConfig' }
        profileDeliveryConfig:
          type: array
          items: { $ref: '#/components/schemas/ChartSeriesConfig' }
        lastEvents:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              eventName: { type: string }
              sourceId: { type: string }
              sourceName: { type: string }
              profileId: { type: string }
              occurredAt: { type: string, format: date-time }
        lastProfiles:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              displayName: { type: string }
              updatedAt: { type: string, format: date-time }

    # --------------------------------------------------------------- Sources
    Source:
      type: object
      required: [id, name, slug, sourceType, isEnabled]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        sourceType:
          type: string
          enum: [event_stream, cloud_app, reverse_etl]
        description: { type: [string, 'null'] }
        isEnabled: { type: boolean }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        eventCountLastHour: { type: integer }
        eventTypeCount: { type: integer }
        pipeCount: { type: integer }
        templateId: { type: [string, 'null'] }
        templateVersion: { type: [string, 'null'] }
        latestTemplateVersion: { type: [string, 'null'] }
        templateIcon: { type: [string, 'null'] }
        writeKey:
          type: [string, 'null']
          description: >-
            Present for event_stream sources with an active write key; null
            for cloud_app sources authenticated another way (e.g. Shopify).

    SourceList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Source' }
        - $ref: '#/components/schemas/PageMeta'

    SourceCreateRequest:
      type: object
      required: [templateId, name]
      properties:
        templateId: { type: string }
        name: { type: string }
        slug: { type: string }

    SourceTemplate:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        sourceType:
          type: string
          enum: [event_stream, cloud_app, reverse_etl]
        version: { type: string }
        icon: { type: string }
        tags:
          type: array
          items: { type: string }
        defaults:
          type: object
          additionalProperties: true
        eventTypeCount: { type: integer }
        realtimeAttributeCount: { type: integer }

    SourceTemplateList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SourceTemplate' }
        - $ref: '#/components/schemas/PageMeta'

    # ---------------------------------------------------------------- Events
    LiveEvent:
      type: object
      description: >-
        One incoming event, already flattened by the backend. Whatever ingest
        envelope the upstream collector uses (nested http payloads, NDJSON
        log lines, vendor-specific ids) is unwrapped server-side — the
        dashboard renders these fields directly and knows nothing about where
        the event came from.
      properties:
        id: { type: string }
        date: { type: string, format: date-time }
        level: { type: string, enum: [info, error] }
        status:
          type: string
          enum: [SUCCESS, FAILED, SKIPPED]
        error:
          type: [string, 'null']
          description: Present when status is FAILED or SKIPPED.
        ingestType:
          type: string
          enum: [browser, server]
        messageId: { type: string }
        type:
          type: string
          description: Analytics call type — page, track, identify, group.
        streamId: { type: string }
        writeKey:
          type: [string, 'null']
          description: Masked by the backend; never return a usable key here.
        originDomain: { type: [string, 'null'] }
        host: { type: [string, 'null'] }
        pageURL: { type: [string, 'null'] }
        pagePath: { type: [string, 'null'] }
        pageTitle: { type: [string, 'null'] }
        referringDomain: { type: [string, 'null'] }
        userId: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        anonymousId: { type: [string, 'null'] }
        destinations:
          type: array
          description: Display names of destinations this event was delivered to.
          items: { type: string }
        context:
          type: object
          description: Analytics context (geo, page, userAgent) as collected.
          additionalProperties: true
        httpHeaders:
          type: object
          description: >-
            Request headers, with `authorization` and any other credential
            header redacted by the backend before it leaves the API.
          additionalProperties: true
        payload:
          type: object
          description: The event body as sent by the client.
          additionalProperties: true

    LiveEventList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/LiveEvent' }
        - $ref: '#/components/schemas/PageMeta'

    EventStream:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        domains:
          type: array
          items: { type: string }
        isEnabled: { type: boolean }
        eventCountLastHour: { type: integer }

    EventStreamList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/EventStream' }
        - $ref: '#/components/schemas/PageMeta'

    # ------------------------------------------------------------- Connectors
    Connector:
      type: object
      properties:
        id: { type: string }
        packageId: { type: string }
        packageType: { type: string }
        iconUrl:
          type: [string, 'null']
          description: >-
            Absolute or same-origin URL the backend serves. Null when no icon
            is available — ConnectorCard.vue falls back to a bundled SVG. It
            must not point at a third-party host: the dashboard's CSP is
            `img-src 'self'` plus its own API, nothing else.
        meta:
          type: object
          properties:
            name: { type: string }
            license: { type: [string, 'null'] }
            connectorSubtype: { type: [string, 'null'] }
          additionalProperties: true

    ConnectorList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Connector' }
        - $ref: '#/components/schemas/PageMeta'

    # ---------------------------------------------------------- Destinations
    Destination:
      type: object
      required: [id, name, slug, destinationType, isEnabled]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        destinationType: { type: string, enum: [event_destination] }
        isEnabled: { type: boolean }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        pipeCount: { type: integer }
        deliveryCountLastHour: { type: integer }
        warehouseConnections:
          type: array
          items: { type: string }
          description: dwh-connections ids this destination writes through, if any.
        templateId: { type: [string, 'null'] }
        templateVersion: { type: [string, 'null'] }
        latestTemplateVersion: { type: [string, 'null'] }
        templateIcon: { type: [string, 'null'] }

    DestinationList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Destination' }
        - $ref: '#/components/schemas/PageMeta'

    DestinationCreateRequest:
      type: object
      required: [templateId, name]
      properties:
        templateId: { type: string }
        name: { type: string }
        slug: { type: string }

    DestinationTemplate:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        destinationType: { type: string, enum: [event_destination] }
        version: { type: string }
        icon: { type: string }
        tags:
          type: array
          items: { type: string }
        defaults:
          type: object
          additionalProperties: true
        secrets:
          type: array
          items:
            type: object
            properties:
              keyPrefix: { type: string }
              description: { type: string }

    DestinationTemplateList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DestinationTemplate' }
        - $ref: '#/components/schemas/PageMeta'

    # ---------------------------------------------------------------- Pipes
    Pipe:
      type: object
      required: [id, sourceId, eventDestinationId, isEnabled]
      properties:
        id: { type: string }
        name: { type: string }
        sourceId: { type: string }
        sourceName: { type: string }
        sourceSlug: { type: string }
        sourceType:
          type: string
          enum: [event_stream, cloud_app, reverse_etl]
        eventDestinationId: { type: string }
        eventDestinationName: { type: string }
        eventDestinationSlug: { type: string }
        isEnabled: { type: boolean }
        version: { type: integer }
        hasFunctionCode: { type: boolean }
        destinationParams:
          type: object
          additionalProperties: true
          description: Free-form config, shape defined by the destination template.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deliveryCountLastHour: { type: integer }

    PipeList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Pipe' }
        - $ref: '#/components/schemas/PageMeta'

    PipeCreateRequest:
      type: object
      required: [sourceId, eventDestinationId]
      properties:
        sourceId: { type: string }
        eventDestinationId: { type: string }
        name: { type: string }
        destinationParams:
          type: object
          additionalProperties: true

    PipesDiagram:
      type: object
      properties:
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        eventDestinations:
          type: array
          items: { $ref: '#/components/schemas/Destination' }
        pipes:
          type: array
          items: { $ref: '#/components/schemas/Pipe' }

    # ---------------------------------------------------------------- Trash
    TrashedRecord:
      description: >-
        Fields added on top of a Source, Destination or Pipe once it's
        trashed — who deleted it and when.
      type: object
      properties:
        deletedAt: { type: string, format: date-time }
        deletedBy: { type: string }
        deletedByName: { type: string }

    SourceTrashed:
      description: A trashed Source. allOf against the live schema so a restore round-trips exactly back to it.
      allOf:
        - $ref: '#/components/schemas/Source'
        - $ref: '#/components/schemas/TrashedRecord'

    DestinationTrashed:
      description: A trashed Destination. allOf against the live schema so a restore round-trips exactly back to it.
      allOf:
        - $ref: '#/components/schemas/Destination'
        - $ref: '#/components/schemas/TrashedRecord'

    PipeTrashed:
      description: A trashed Pipe. allOf against the live schema so a restore round-trips exactly back to it.
      allOf:
        - $ref: '#/components/schemas/Pipe'
        - $ref: '#/components/schemas/TrashedRecord'

    Trash:
      type: object
      description: >-
        All three trashed kinds together, unpaginated — see the
        pagination note on GET /v1/trash for why.
      properties:
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceTrashed' }
        destinations:
          type: array
          items: { $ref: '#/components/schemas/DestinationTrashed' }
        pipes:
          type: array
          items: { $ref: '#/components/schemas/PipeTrashed' }

    TrashList:
      description: >-
        One resource kind's trash, cursor-paginated — returned by
        GET /v1/trash when its `resource` filter is set.
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/SourceTrashed'
                  - $ref: '#/components/schemas/DestinationTrashed'
                  - $ref: '#/components/schemas/PipeTrashed'
        - $ref: '#/components/schemas/PageMeta'

    RestoreResult:
      type: object
      properties:
        restored: { type: boolean }
        cascade:
          type: array
          description: >-
            What else had to (or needs to) come back with this record —
            mirrors usePipesTrash()'s cascade array on a pipe whose
            source/destination is itself trashed.
          items:
            type: object
            properties:
              kind: { type: string, enum: [source, destination] }
              id: { type: string }
              name: { type: string }
              state: { type: string, enum: [live, trashed, missing] }

    # ------------------------------------------------------------- Settings
    WorkspaceSettings:
      type: object
      properties:
        workspace:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
            region: { type: string }
            regionLabel: { type: string }
            timezone: { type: string }
            createdAt: { type: string, format: date-time }
        errorAlerts:
          type: object
          properties:
            slackWebhooks:
              type: array
              items: { $ref: '#/components/schemas/WebhookAlert' }
            teamsWebhooks:
              type: array
              items: { $ref: '#/components/schemas/WebhookAlert' }
        retention: { $ref: '#/components/schemas/RetentionSettings' }
        identityResolution:
          type: object
          properties:
            strategy: { type: string, enum: [deterministic, probabilistic] }
            mergeOnSharedEmail: { type: boolean }
            mergeOnSharedPhone: { type: boolean }
            maxIdentifiersPerProfile: { type: integer }
        instanceCapabilities:
          type: object
          properties:
            signInLink: { type: boolean }
            userManagement: { type: boolean }
            googleLoginUrl: { type: string }
            microsoftLoginUrl: { type: string }

    RetentionSettings:
      type: object
      properties:
        rawEventDays: { type: integer }
        errorLogDays: { type: integer }
        profileInactivityDays: { type: integer }

    WebhookAlert:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        url:
          type: string
          description: >-
            Returned with its token segment redacted, same as today's mock
            data — there is nothing further to reveal on a GET.
        minSeverity: { type: string, enum: [warning, error] }
        isEnabled: { type: boolean }

    Member:
      type: object
      properties:
        id: { type: string }
        pk: { type: integer }
        email: { type: string, format: email }
        username: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, editor, viewer] }
        isActive: { type: boolean }
        lastLogin: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PendingInvite:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, editor, viewer] }
        invitedBy: { type: string }
        invitedByName: { type: string }
        invitedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    MembersPage:
      description: >-
        managedUsers is cursor-paginated (PageMeta applies to it);
        pendingInvites is returned in full, unpaginated — see the
        description on GET /v1/members for why. Renamed from the earlier
        draft's `pendingUsers` key for clarity — these are invites, not
        users yet.
      allOf:
        - type: object
          required: [managedUsers, pendingInvites]
          properties:
            managedUsers:
              type: array
              items: { $ref: '#/components/schemas/Member' }
            pendingInvites:
              type: array
              items: { $ref: '#/components/schemas/PendingInvite' }
        - $ref: '#/components/schemas/PageMeta'

    ApiToken:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        tokenPreview:
          type: string
          description: e.g. "ffp_live_…a91c" — never the full value.
        scopes:
          type: array
          items: { type: string }
        createdBy: { type: string }
        createdByName: { type: string }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        isRevoked: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ApiTokenList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ApiToken' }
        - $ref: '#/components/schemas/PageMeta'

    # ------------------------------------------------------------ Warehouse
    DwhConnection:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [snowflake, bigquery, redshift] }
        host: { type: string }
        port: { type: integer }
        database: { type: string }
        schema: { type: string }
        username: { type: string }
        isPrimary: { type: boolean }
        status: { type: string, enum: [connected, error, pending] }
        lastValidatedAt: { type: string, format: date-time }
        tableCount: { type: integer }
        modelCount: { type: integer }
        syncCount: { type: integer }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DwhConnectionList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DwhConnection' }
        - $ref: '#/components/schemas/PageMeta'

    # ----------------------------------------------------------- Monitoring
    ErrorLogEntry:
      type: object
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        category:
          type: string
          enum:
            - event_stream
            - cloud_app
            - reverse_etl
            - pipe
            - event_destination
            - profile_destination
            - secrets
            - profile_refresh
            - dwh_sync
        severity: { type: string, enum: [warning, error] }
        code: { type: string }
        message: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        entityName: { type: string }
        count: { type: integer }
        context:
          type: object
          additionalProperties: true

    ErrorLogEntryList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ErrorLogEntry' }
        - $ref: '#/components/schemas/PageMeta'

    ErrorStats:
      type: object
      properties:
        updatedAt: { type: string, format: date-time }
        totalErrorsLastHour: { type: integer }
        totalErrorsLast24Hours: { type: integer }
        errorSeries:
          type: array
          description: >-
            Hourly time-bucketed series, bounded by the query window — not
            cursor-paginated like a record list (see Pagination in the
            top-level description).
          items:
            type: object
            description: One hourly bucket, count per ErrorLogEntry category.
            properties:
              bucket: { type: string, format: date-time }
            additionalProperties: { type: integer }

    HealthSnapshot:
      type: object
      properties:
        updatedAt: { type: string, format: date-time }
        queues:
          type: object
          properties:
            identityResolution: { $ref: '#/components/schemas/QueueDepth' }
            eventDeliveries: { $ref: '#/components/schemas/QueueDepth' }
            profileRefresh: { $ref: '#/components/schemas/QueueDepth' }
            profileDeliveries: { $ref: '#/components/schemas/QueueDepth' }
        heartbeat:
          type: object
          description: >-
            Cursor-paginated log of the async worker's health-check runs —
            paged via the heartbeatCursor/heartbeatLimit query params on
            GET /v1/health (not the top-level cursor/limit, since health
            itself is a snapshot, not a list — see that endpoint's
            description).
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [success, failure] }
                  model: { type: string }
                  startedAt: { type: string, format: date-time }
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }

    QueueDepth:
      type: object
      properties:
        count: { type: integer }
        oldestAt: { type: [string, 'null'], format: date-time }
        processedLastMinute: { type: integer }

    # ------------------------------------------------------------- Profiles
    Profile:
      type: object
      properties:
        id: { type: string }
        displayName: { type: string }
        primaryEmail: { type: [string, 'null'], format: email }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        identifiers:
          type: array
          items:
            type: object
            properties:
              typeId: { type: string }
              type: { type: string }
              value: { type: string }
              firstSeenAt: { type: string, format: date-time }
        attributes:
          type: object
          description: Free-form key/value fan attributes (spend, tier, consent, ...).
          additionalProperties: true
        audiences:
          type: array
          items: { type: string }
        eventCountLast30Days: { type: integer }

    ProfileList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Profile' }
        - $ref: '#/components/schemas/PageMeta'

    IdentifierType:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        displayName: { type: string }
        maxIdentifiers: { type: integer }
        priority: { type: integer }
        version: { type: integer }
        deletedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        eventTypes:
          type: array
          items:
            type: object
            properties:
              eventTypeId: { type: string }
              eventTypeName: { type: string }
              sourceId: { type: string }
              sourceName: { type: string }
              sourceType: { type: string }

    IdentifierTypeList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/IdentifierType' }
        - $ref: '#/components/schemas/PageMeta'

    # --------------------------------------------------------------- Secrets
    Secret:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        description: { type: [string, 'null'] }
        valuePreview:
          type: string
          description: e.g. "EAAG…9f2c" — never the full value.
        usedByCount: { type: integer }
        usedBy:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [event_destination, source] }
              id: { type: string }
              name: { type: string }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SecretList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Secret' }
        - $ref: '#/components/schemas/PageMeta'

    # --------------------------------------------------------- Authorizations
    OAuthProvider:
      type: object
      properties:
        id: { type: string }
        displayName: { type: string }
        scopes:
          type: array
          items: { type: string }

    OAuthProviderList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OAuthProvider' }
        - $ref: '#/components/schemas/PageMeta'

    OAuthAuthorization:
      type: object
      properties:
        id: { type: string }
        providerId: { type: string }
        providerName: { type: string }
        accountLabel: { type: string }
        scopes:
          type: array
          items: { type: string }
        status: { type: string, enum: [active, expired, revoked] }
        authorizedBy: { type: string }
        authorizedByName: { type: string }
        authorizedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        usedByCount: { type: integer }

    OAuthAuthorizationList:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OAuthAuthorization' }
        - $ref: '#/components/schemas/PageMeta'
