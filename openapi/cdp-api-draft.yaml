          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Sources]
      operationId: updateSource
      summary: Update a source
      description: >-
        Backs useSources().setEnabled() today (isEnabled only); the request
        body is written open in case editable fields grow beyond that. No
        Idempotency-Key — repeating the same patch converges to the same
        state, so there is nothing an idempotency key would additionally
        protect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isEnabled: { type: boolean }
                name: { type: string }
                description: { type: [string, 'null'] }
      responses:
