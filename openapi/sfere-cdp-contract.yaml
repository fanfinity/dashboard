          anyOf:
            - type: string
            - type: 'null'
        identifier_types:
          type: array
          items:
            type: string
        code:
          anyOf:
            - type: string
            - type: 'null'
        cron:
          anyOf:
            - type: string
            - type: 'null'
    ProfileIdentifier:
      type: object
