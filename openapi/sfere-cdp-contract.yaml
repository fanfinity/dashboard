          type: string
        kind:
          type: string
          enum:
            - transform
            - filter
            - enrich
          default: transform
        code:
          type: string
        template:
          type: string
          description: 'Instantiate from this template instead of sending `code`.'
      required:
        - name
        - slug
    FunctionDefinition:
      type: object
      title: Function
      description: |-
        A transform in the account library. `PipelineFunction` is an *instance* of one attached to a pipeline — this is the definition behind it.
      properties:
        id:
          type: string
        account_id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          anyOf:
            - type: string
            - type: 'null'
        kind:
          type: string
          enum:
            - transform
            - filter
            - enrich
          description: 'What it does to an event: reshape it, drop it, or add to it.'
        code:
          type: string
          description: TypeScript, run in the backend sandbox.
        version:
          type: integer
          minimum: 1
        template:
          anyOf:
            - type: string
            - type: 'null'
          description: Platform template this came from, if any.
        template_version:
          anyOf:
            - type: integer
            - type: 'null'
        latest_template_version:
          anyOf:
            - type: integer
            - type: 'null'
          description: 'Above `template_version` means an upgrade is available.'
        attached_pipeline_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - account_id
        - name
        - slug
        - kind
        - code
        - version
        - created_at
        - updated_at
    FunctionTestRequest:
      type: object
      title: Function test request
      properties:
        event:
          type: object
          additionalProperties: true
          description: A sample event to run the function on.
        code:
          type: string
          description: Unsaved code to run instead of the stored version, so the editor can test before saving.
      required:
        - event
    FunctionTestResult:
      type: object
      title: Function test result
      description: |-
        A function that throws is a `200` with `ok: false` — the run happened, and the editor needs the error to display.
      properties:
        ok:
          type: boolean
        result:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          description: 'The event as it came out. Null means the function dropped it — which is success for a filter.'
        dropped:
          type: boolean
          default: false
        error:
          anyOf:
            - type: string
            - type: 'null'
        logs:
          type: array
          items:
            '$ref': '#/components/schemas/SyncRunLogEntry'
        duration_ms:
          type: integer
      required:
        - ok
        - dropped
        - logs
