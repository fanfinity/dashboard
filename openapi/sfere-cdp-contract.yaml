    DeliveryError:
      type: object
      title: Delivery error
      properties:
        id:
          type: string
        account_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        severity:
          type: string
          enum:
            - warning
            - error
        source_id:
          anyOf:
            - type: string
            - type: 'null'
        destination_id:
          anyOf:
            - type: string
            - type: 'null'
        pipeline_id:
          anyOf:
            - type: string
            - type: 'null'
        function_id:
          anyOf:
            - type: string
            - type: 'null'
          description: Set when a function threw rather than the destination rejecting the event.
        message:
          type: string
          description: Safe to show a user. Credentials are redacted by the backend.
        code:
          anyOf:
            - type: string
            - type: 'null'
          description: 'Stable machine code for grouping, e.g. `destination_timeout`.'
        retry_count:
          type: integer
          minimum: 0
        is_retryable:
          type: boolean
          description: 'False for a permanent failure — a rejected schema will fail identically forever.'
        event_id:
          anyOf:
            - type: string
            - type: 'null'
        payload:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          description: |-
            The event that failed, kept for the retention window so a retry has something to send. Null once it expires.
      required:
        - id
        - account_id
        - occurred_at
        - severity
        - message
        - retry_count
        - is_retryable
