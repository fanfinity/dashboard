          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        profile_count:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - account_id
        - name
        - slug
        - is_enabled
        - identifier_types
        - created_at
        - updated_at
