        - active
        - ended
        - expired
      title: SupportSessionStatus
    SyncRun:
      properties:
        id:
          type: string
          title: Id
        account_id:
          type: string
          title: Account Id
        source_id:
          type: string
          title: Source Id
        mode:
          type: string
          title: Mode
        status:
          type: string
          title: Status
          description: 'pending | running | success | failed'
        date_from:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Date From
        date_to:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Date To
        counts:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Counts
          description: Per-entity record counts returned by the connector.
        error:
          anyOf:
            - type: string
            - type: 'null'
          title: Error
        started_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Started At
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Completed At
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
        - id
        - account_id
        - source_id
        - mode
        - status
        - created_at
        - updated_at
      title: SyncRun
      description: A record of one source sync and its outcome.
    SyncRunLogEntry:
      type: object
      title: Sync run log entry
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum:
            - info
            - warn
            - error
        message:
          type: string
        entity:
          anyOf:
            - type: string
            - type: 'null'
          description: Which catalog entity the line concerns, when it concerns one.
      required:
        - timestamp
        - level
        - message
    SyncSchedule:
      type: object
      title: Sync schedule
      properties:
        source_id:
          type: string
        is_enabled:
          type: boolean
        cron:
          anyOf:
            - type: string
            - type: 'null'
          description: 'Five-field cron expression, interpreted in `timezone`.'
        timezone:
          type: string
          default: UTC
          description: IANA name. Matters for a daily sync a customer expects at local midnight.
        mode:
          '$ref': '#/components/schemas/Mode'
        next_run_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        last_run_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - source_id
        - is_enabled
        - mode
    SyncScheduleUpdate:
      type: object
      title: Sync schedule update
      properties:
        is_enabled:
          type: boolean
        cron:
          type: string
        timezone:
          type: string
        mode:
          '$ref': '#/components/schemas/Mode'
      required:
        - is_enabled
    SyncTriggerRequest:
      properties:
        mode:
          '$ref': '#/components/schemas/Mode'
        date_from:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Date From
          description: 'Start of the window (required for date_range; ignored for full).'
        date_to:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Date To
          description: 'End of the window (optional; defaults to now for date_range/incremental).'
        entities:
          anyOf:
            - items:
                type: string
              type: array
            - type: 'null'
          title: Entities
          description: 'Optional subset of entity keys to sync; defaults to all available.'
      type: object
      required:
        - mode
      title: SyncTriggerRequest
      description: Request body to trigger a source sync.
    TemplateSecretRequirement:
      type: object
      title: Template secret requirement
      description: |-
        A credential a template needs. The value lives in the backend's secret store; the browser only ever holds this description of it.
      properties:
        key_prefix:
          type: string
          description: 'Naming convention for the secret, e.g. `META_ACCESS_TOKEN`.'
        description:
          type: string
        required:
          type: boolean
          default: true
      required:
        - key_prefix
        - description
    TiktokEventsDestinationConfig:
      type: object
      title: TikTok Events API destination config
      properties:
        event_source_id:
          type: string
          description: Pixel or offline event set id.
        access_token:
          type: string
          writeOnly: true
        test_event_code:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - event_source_id
        - access_token
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
          description: Firebase ID token for use as Bearer token
        token_type:
          '$ref': '#/components/schemas/TokenType'
        expires_in:
          anyOf:
            - type: integer
            - type: 'null'
          title: Expires In
          description: Token lifetime in seconds
        refresh_token:
          anyOf:
            - type: string
            - type: 'null'
          title: Refresh Token
          description: |
            Firebase refresh token. Exchange it at /v1/auth/refresh for a new access token when the current one expires.
      type: object
      required:
        - access_token
        - token_type
      title: TokenResponse
    TokenType:
      type: string
      enum:
        - bearer
      title: TokenType
    TrashItem:
      type: object
      title: Trash item
      properties:
        id:
          type: string
        account_id:
          type: string
        resource:
          '$ref': '#/components/schemas/TrashResource'
        resource_id:
          type: string
        name:
          type: string
          description: The resource's name at deletion, so the list reads without resolving each one.
        deleted_at:
          type: string
          format: date-time
        deleted_by:
          anyOf:
            - type: string
            - type: 'null'
          description: User id, or null when a cascade deleted it.
        purge_at:
          type: string
          format: date-time
          description: When the restore window closes and it goes for good.
        restorable:
          type: boolean
          description: 'False when something blocks restore — the slug was reused, or the parent is gone too.'
        restore_blocked_reason:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - id
        - account_id
        - resource
        - resource_id
        - name
        - deleted_at
        - purge_at
        - restorable
    TrashResource:
      type: string
      title: Trash resource
      description: Which kind of resource a trash entry holds. Only these three are soft-deletable.
      enum:
        - sources
        - destinations
        - pipelines
    User:
      properties:
        id:
          type: string
          title: Id
        email:
          type: string
          format: email
          title: Email
        display_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Display Name
      type: object
      required:
        - id
        - email
      title: User
    WarehouseConnection:
      type: object
      title: Warehouse connection
      description: |-
        A warehouse the customer owns, which Sfere reads from or writes to. Distinct from a `Destination`, which Sfere provisions and manages — different lifecycle, so a separate resource rather than a flag on one.
      properties:
        id:
          type: string
        account_id:
          type: string
        name:
          type: string
        slug:
          type: string
        warehouse_type:
          type: string
          enum:
            - clickhouse
            - postgres
            - bigquery
            - snowflake
        config:
          '$ref': '#/components/schemas/AnyDestinationConfig'
        direction:
          type: string
          enum:
            - read
            - write
            - both
          default: write
          description: "`read` powers reverse ETL out of the customer's warehouse; `write` lands Sfere data in it."
        is_enabled:
          type: boolean
        last_test_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        last_test_ok:
          anyOf:
            - type: boolean
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - account_id
        - name
        - slug
        - warehouse_type
        - direction
        - is_enabled
        - created_at
        - updated_at
    WarehouseConnectionCreate:
      type: object
      title: Warehouse connection create
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]*$'
        warehouse_type:
          type: string
          enum:
            - clickhouse
            - postgres
            - bigquery
            - snowflake
        config:
          '$ref': '#/components/schemas/AnyDestinationConfig'
        direction:
          type: string
          enum:
            - read
            - write
            - both
          default: write
      required:
        - name
        - slug
        - warehouse_type
        - config
    WarehouseConnectionUpdate:
      type: object
      title: Warehouse connection update
      properties:
        name:
          type: string
        config:
          '$ref': '#/components/schemas/AnyDestinationConfig'
        direction:
          type: string
          enum:
            - read
            - write
            - both
        is_enabled:
          type: boolean
    WebhookDestinationConfig:
      type: object
      title: Webhook destination config
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          enum:
            - POST
            - PUT
          default: POST
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Sent with every request. Write-only, because these routinely carry an authorization header.
        batch_size:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 30000
          default: 5000
      required:
        - url
    WriteKey:
      type: object
      title: Write key
      description: |-
        A credential events are sent on. `public` keys are browser-safe; `private` keys are for server-side use only.
      properties:
        id:
          type: string
        source_id:
          type: string
        kind:
          type: string
          enum:
            - public
            - private
        name:
          anyOf:
            - type: string
            - type: 'null'
          description: 'Optional label, e.g. "marketing site".'
        hint:
          type: string
          description: Last four characters, for recognising a key without revealing it.
        created_at:
          type: string
          format: date-time
        last_used_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: 'Null if the key has never been used — which usually means an SDK was never wired up.'
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - id
        - source_id
        - kind
        - hint
        - created_at
    WriteKeyCreate:
      type: object
      title: Write key create
      properties:
        kind:
          type: string
          enum:
            - public
            - private
          default: public
        name:
          type: string
          maxLength: 255
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Omit for a key that does not expire.
      required:
        - kind
    WriteKeyCreated:
      type: object
      title: Write key created
      description: 'The one response that carries `plaintext`. It is not retrievable afterwards.'
      properties:
        key:
          '$ref': '#/components/schemas/WriteKey'
        plaintext:
          type: string
          description: The secret. Shown to the user once and never returned again.
      required:
        - key
        - plaintext
    WriteKeyList:
      type: object
      title: Write key list
      description: 'A plain list rather than a page: a source has a handful of keys, not thousands.'
      properties:
        items:
          type: array
          items:
            '$ref': '#/components/schemas/WriteKey'
      required:
        - items
    ZidSourceConnectResult:
      properties:
        status:
          type: string
          title: Status
        source_id:
          type: string
          title: Source Id
        store_id:
          type: string
          title: Store Id
        webhooks:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Webhooks
        snippet:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Snippet
      type: object
      required:
        - status
        - source_id
        - store_id
      title: ZidSourceConnectResult
