      type: object
      title: Profile builder create
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]*$'
        destination_id:
          type: string
        identifier_types:
          type: array
          items:
            type: string
          minItems: 1
        code:
          type: string
        cron:
          type: string
      required:
        - name
        - slug
        - identifier_types
