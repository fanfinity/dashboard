components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Identity Platform ID token from `POST /v1/auth/token`, sent as `Authorization: Bearer <access_token>`. Short-lived (~1h); trade the refresh token at `POST /v1/auth/refresh` when it expires. Unlike Jitsu, this is not a `keyId:secret` API key — per-account API tokens are proposed under API tokens.
  schemas:
    Problem:
      type: object
      title: Problem
      description: |-
        RFC 9457 problem details, served as `application/problem+json`. Every error response in this contract uses this shape. The dashboard surfaces `detail` and throws `ApiError` carrying `status` plus this body.
      properties:
        type:
          anyOf:
            - type: string
            - type: 'null'
          default: 'about:blank'
          title: Type
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          anyOf:
            - type: string
            - type: 'null'
          title: Detail
        instance:
          anyOf:
            - type: string
            - type: 'null'
          title: Instance
      required:
        - title
        - status
    Account:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        slug:
          type: string
          title: Slug
        created_at:
          type: string
          format: date-time
          title: Created At
        jitsu_workspace_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Jitsu Workspace Id
      type: object
      required:
        - id
        - name
        - slug
        - created_at
      title: Account
    AccountCreate:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        slug:
          type: string
          maxLength: 255
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9-]*$'
          title: Slug
      type: object
      required:
        - name
        - slug
      title: AccountCreate
    AccountMembership:
      properties:
        account:
          '$ref': '#/components/schemas/Account'
        role:
          '$ref': '#/components/schemas/Role'
      type: object
      required:
        - account
        - role
      title: AccountMembership
    AnyDestinationConfig:
      title: Any destination config
      description: |-
        The config for a destination, selected by its `destination_type`. Every credential field is write-only: sent on create or update, returned as `"***"`.

        `DestinationConfig` (the ClickHouse variant) is the shipped shape and is referenced rather than restated.
      oneOf:
        - '$ref': '#/components/schemas/DestinationConfig'
        - '$ref': '#/components/schemas/PostgresDestinationConfig'
        - '$ref': '#/components/schemas/BigqueryDestinationConfig'
        - '$ref': '#/components/schemas/SnowflakeDestinationConfig'
        - '$ref': '#/components/schemas/MetaConversionsDestinationConfig'
        - '$ref': '#/components/schemas/TiktokEventsDestinationConfig'
        - '$ref': '#/components/schemas/GoogleAdsDestinationConfig'
        - '$ref': '#/components/schemas/WebhookDestinationConfig'
        - '$ref': '#/components/schemas/S3DestinationConfig'
    ApiToken:
      type: object
      title: API token
      properties:
        id:
          type: string
        account_id:
          type: string
        name:
          type: string
        hint:
          type: string
          description: Last four characters.
        scopes:
          type: array
          items:
            '$ref': '#/components/schemas/ApiTokenScope'
        created_by:
          type: string
          description: User id of the member who minted it.
        created_at:
          type: string
          format: date-time
        last_used_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - id
        - account_id
        - name
        - hint
        - scopes
        - created_by
        - created_at
    ApiTokenCreate:
      type: object
      title: API token create
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        scopes:
          type: array
          items:
            '$ref': '#/components/schemas/ApiTokenScope'
          minItems: 1
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Omit for a token that does not expire.
      required:
        - name
        - scopes
    ApiTokenCreated:
      type: object
      title: API token created
      properties:
        token:
          '$ref': '#/components/schemas/ApiToken'
        plaintext:
          type: string
          description: 'The token. Shown once; not retrievable afterwards.'
      required:
        - token
        - plaintext
    ApiTokenScope:
      type: string
      title: API token scope
      description: 'Coarse on purpose: a token holds fewer permissions than a role, not a different set.'
      enum:
        - read
        - write
        - admin
    BigqueryDestinationConfig:
      type: object
      title: BigQuery destination config
      properties:
        project_id:
          type: string
        dataset:
          type: string
        location:
          type: string
          default: US
        service_account_key:
          type: string
          writeOnly: true
          description: 'Service-account JSON key. Held by the backend; never returned.'
      required:
        - project_id
        - dataset
        - service_account_key
    Body_login:
      properties:
        grant_type:
          type: string
          const: password
          title: Grant Type
          default: password
        username:
          type: string
          minLength: 1
          title: Username
        password:
          type: string
          minLength: 1
          title: Password
      type: object
      required:
        - username
        - password
      title: Body_login
    ConnectionTestResult:
      type: object
      title: Connection test result
      description: |-
        A failed test is a `200` with `ok: false`, not a `4xx`. The request succeeded — it is the connection that did not, and the dashboard needs the reason to render rather than an exception to catch.
      properties:
        ok:
          type: boolean
        error:
          anyOf:
            - type: string
            - type: 'null'
          description: 'Why it failed, safe to show a user. Null when `ok` is true.'
        latency_ms:
          anyOf:
            - type: integer
            - type: 'null'
        checked_at:
          type: string
          format: date-time
        details:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          description: 'Connector-specific diagnostics — permissions found, tables visible, API version reached.'
      required:
        - ok
        - checked_at
    Connector:
      type: object
      title: Connector
      description: A source or destination type the platform supports.
      properties:
        id:
          type: string
          description: 'Stable slug, e.g. `zid`, `meta-conversions-api`.'
        name:
          type: string
        kind:
          type: string
          enum:
            - source
            - destination
        description:
          type: string
        source_type:
          anyOf:
            - type: string
            - type: 'null'
          description: 'For a source connector: `event_stream` or `cloud_app`.'
        destination_type:
          anyOf:
            - '$ref': '#/components/schemas/DestinationType'
            - type: 'null'
        protocol:
          anyOf:
            - type: string
              enum:
                - native
                - airbyte
            - type: 'null'
        package:
          anyOf:
            - type: string
            - type: 'null'
          description: Connector image, for an Airbyte-protocol connector.
        version:
          type: string
        icon:
          type: string
          description: "Icon key served by this API. Not a third-party URL — `img-src` is `'self'`."
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - available
            - beta
            - coming_soon
          description: '`coming_soon` is listed but not selectable, so the catalog can show the roadmap.'
        requires_oauth:
          type: boolean
          default: false
          description: Needs an authorization before it can sync.
      required:
        - id
        - name
        - kind
        - version
        - status
    ConnectorImage:
      type: object
      title: Connector image
      properties:
        id:
          type: string
        account_id:
          type: string
        package:
          type: string
          description: 'Image reference, e.g. `ghcr.io/acme/source-internal`.'
        version:
          type: string
        protocol:
          type: string
          enum:
            - airbyte
          default: airbyte
        status:
          type: string
          enum:
            - pending
            - ready
            - failed
        error:
          anyOf:
            - type: string
            - type: 'null'
        created_at:
          type: string
          format: date-time
      required:
        - id
        - account_id
        - package
        - version
        - status
        - created_at
    ConnectorImageCreate:
      type: object
      title: Connector image create
      properties:
        package:
          type: string
        version:
          type: string
        credentials:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          writeOnly: true
          description: Registry pull credentials, if the image is private.
      required:
        - package
        - version
    ConnectorSpec:
      type: object
      title: Connector spec
      description: |-
        The config schema a connector needs, as JSON Schema, so a create form can be rendered from it rather than hand-built per connector. `pending` means the backend is still fetching it from the connector image.
      properties:
        connector_id:
          type: string
        version:
          type: string
        pending:
          type: boolean
          default: false
        error:
          anyOf:
            - type: string
            - type: 'null'
        config_schema:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          description: |-
            JSON Schema. `format: password` on a property marks it as a secret the form should mask and store by reference.
        supported_modes:
          type: array
          items:
            '$ref': '#/components/schemas/Mode'
        documentation_url:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - connector_id
        - version
        - pending
    Customer:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        email:
          type: string
