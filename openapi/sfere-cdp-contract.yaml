      type: object
      title: Notification channel
      properties:
        id:
          type: string
        account_id:
          type: string
        name:
          type: string
        channel:
          type: string
          enum:
            - email
            - slack
          default: slack
        events:
          type: array
          items:
            type: string
            enum:
              - all
              - sync
              - batch
              - dead
              - account
          default:
            - all
          description: '`dead` covers events that failed every retry and were dropped.'
        slack_webhook_url:
          anyOf:
            - type: string
            - type: 'null'
          description: 'Write-only in practice — returned masked.'
        emails:
          type: array
          items:
            type: string
            format: email
        recurring_alerts_period_hours:
          type: integer
          minimum: 0
          maximum: 720
          default: 168
          description: How long to wait before re-alerting on a condition that is still failing. 0 alerts every time.
        summarize_batch_notifications_by_table:
          type: boolean
          default: true
        is_enabled:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
