        - identifiers
        - traits
        - confidence
        - first_seen_at
        - last_seen_at
        - event_count
        - updated_at
    ProfileBuilder:
      type: object
      title: Profile builder
      properties:
        id:
          type: string
        account_id:
          type: string
        name:
          type: string
        slug:
          type: string
        is_enabled:
          type: boolean
        destination_id:
          anyOf:
            - type: string
            - type: 'null'
          description: Where built profiles are written. Null keeps them queryable through this API only.
        identifier_types:
          type: array
          items:
            type: string
