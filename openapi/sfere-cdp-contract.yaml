openapi: '3.1.0'
info:
  title: Sfere CDP API
  version: '2026-08-26'
  summary: The contract between the Sfere dashboard and the Sfere backend.
  description: |-
    This document is the agreed interface between the Sfere dashboard and the Sfere backend. It is
    one document on purpose, covering both what the backend serves today and what the dashboard
    still needs, because two documents that disagree are worse than one that admits what is missing.

    ## Read the status field first

    Every operation carries `x-sfere-status`:

    - **`shipped`** — live on the backend now. Generated directly from the backend's own OpenAPI
      output, so these agree with the running service by construction. Treat them as fixed:
      the dashboard already calls them.
    - **`proposed`** — not built. Shape, path and vocabulary are a proposal for the backend team,
      derived from what the dashboard's screens need and from how Jitsu models the same domain.
      Nothing here is settled; this is the half to argue with.

    An operation that also names `x-jitsu-equivalent` has a counterpart in the Jitsu API, given so
    the two can be read side by side.

    ## What Sfere borrows from Jitsu, and what it does not

    The backend runs Jitsu underneath — `Account.jitsu_workspace_id`, `Source.jitsu_site_id`,
    `Destination.jitsu_destination_id` and `Pipeline.jitsu_link_id` are all provisioned there. So
    Jitsu's model informs the payload shapes and much of the vocabulary in the proposed half.

    It informs **nothing** about the surface:

    | Jitsu | Sfere |
    | --- | --- |
    | `/api/{workspaceId}/config/stream` | `/v1/accounts/{account_id}/sources` |
    | workspace | account |
    | stream, service | source (`source_type` distinguishes them) |
    | link, connection | pipeline (the dashboard says "pipe") |
    | `camelCase` | `snake_case` |
    | bare arrays | `{items, total, page, size, pages}` |
    | `keyId:secret` bearer | Identity Platform bearer token |

    Jitsu is an implementation detail of the backend, not a host the dashboard knows. The dashboard's
    CSP names only the Sfere API hosts, so any endpoint in this document is served by Sfere or it
    cannot be called at all.

    ## Conventions that hold everywhere

    - **Scoping follows ownership, not uniformity.** Anything an account owns is under
      `/v1/accounts/{account_id}/…`. Identity, the customer index, support sessions, the connector
      catalog and health are flat, because none of them belong to one account.
    - **Collections are paginated** with `page` (from 1) and `size` (max 100), and answer the
      `Page[…]` envelope. A read that is inherently bounded — a pipeline's functions, the live event
      log — returns a plain list instead and says so.
    - **Fields are `snake_case`.** The dashboard camelizes at the edge (`src/lib/apiShape.js`);
      do not pre-camelize on the backend to save it the trouble.
    - **Errors are RFC 9457** `application/problem+json`, the `Problem` schema below.
    - **Every operation needs a bearer token** unless it states `security: []`. Nine do:
      registration, the two token endpoints, the three health probes — and the three
      `/v1/customers` reads, which the backend currently serves open. Shipped operations carry the
      backend's own `security` verbatim; proposed ones inherit the global requirement.
    - **Timestamps are RFC 3339 UTC.**
    - **Creates that provision infrastructure accept `Idempotency-Key`.** Creating a source, a
      destination or a pipeline has side effects beyond a row, so a retried POST must not double up.
    - **Secrets are write-only.** A credential sent in a config comes back as `"***"`, never in full.

    ## Regenerating this file

    ```bash
    pnpm openapi:pull      # refresh openapi/sfere-api.json from staging
    pnpm contract:build    # regenerate this document
    pnpm contract:check    # validate it
    pnpm docs:cdp          # browse it on :3001
    ```

    The shipped half comes from `openapi/sfere-api.json`; the proposed half is hand-written in
    `openapi/cdp-proposals.mjs`. Edit the proposals there — this file is generated and edits to it
    are lost on the next build.
  contact:
    name: Sfere
    url: 'https://sfere.io'
    email: 'm.anas@sfere.io'
  license:
    name: 'Proprietary — Sfere internal'
    url: 'https://sfere.io'
servers:
  - url: 'https://api-staging.sfere.io'
    description: 'Staging — what the dashboard at app-staging.sfere.io calls'
  - url: 'https://api.sfere.io'
    description: 'Production — not live yet; the production overlay has never been applied'
  - url: 'http://localhost:8080'
    description: 'Local backend (../backend, `make run`)'
security:
  - HTTPBearer: []
tags:
  - name: Identity
    description: |-
      Registration, sign-in and the signed-in user. Sign-in is a backend call, not an Identity Platform SDK call — the browser holds no Firebase config and talks to no host but this API.
  - name: Accounts
    description: |-
      The tenancy boundary. Everything a customer owns hangs off an account, and almost every path below is scoped `/v1/accounts/{account_id}/…`.

      This is Sfere's name for what Jitsu calls a workspace: Workspace metadata and settings.
  - name: Members
    description: 'Who can see an account, and at what role — owner, admin, member or viewer.'
  - name: Support
    description: Time-boxed support access to a customer account.
  - name: Customers
    description: |-
      End customers — the people an account's data is about, as distinct from the users who sign in to the dashboard.
  - name: Sources
    description: |-
      Where data enters. A source is either an **event stream** that receives events on a write key, or a **cloud app** the backend polls on a schedule; `source_type` says which.

      Jitsu splits these into two objects. Its stream: A **stream** is an incoming-events endpoint (formerly called a *source*). Each stream has its own write keys and the list of domains allowed to send events.

      And its service: A **service** is an external system polled by a connector (Airbyte protocol) — for example Stripe, HubSpot, or a database. Services produce data on a schedule that's then routed to destinations.

      Sfere merges them, because "add a source" is one job in the product.
  - name: Destinations
    description: |-
      Where data lands.

      A **destination** is a target system Jitsu sends events to — a data warehouse (Postgres, ClickHouse, BigQuery, Snowflake, Redshift), object storage (S3, GCS), or a downstream service.
  - name: Pipelines
    description: |-
      One source wired to one destination. The dashboard calls this a **pipe**; Jitsu calls it a link.

      A **connection** wires a stream (or service) to a destination. It controls which data flows where and what optional functions run along the way.
  - name: Functions
    description: |-
      Transforms that run on events in flight.

      User-defined functions (UDFs) that transform, filter, or enrich events as they flow through the pipeline. Functions are written in TypeScript and run inside Jitsu's sandbox.
  - name: Syncs
    description: |-
      Pulling data from a cloud-app source on demand or on a schedule.

      Endpoints that drive **sync runs** — pulling data from a service into a destination on demand. Use these to fetch a connector's config schema, discover its streams, trigger and monitor runs, and stream task logs.
  - name: Events
    description: |-
      The live event log and per-source/per-destination event counts. Records come back already flattened and vendor-neutral; the dashboard has no ingestion path and cannot send an event.
  - name: Dashboard
    description: 'The home screen aggregate — one call that feeds totals, per-entity stats and time buckets.'
  - name: Metrics
    description: |-
      Event volume over time, for charts rather than for the home screen tiles.

      Workspace event volume and ingestion metrics.
  - name: Connectors
    description: |-
      The catalog of source and destination types available to pick from, and the config schema each one needs. Global rather than account-scoped: the catalog is the same for everybody.
  - name: Profiles
    description: |-
      Per-person profiles built by stitching identities across events.

      **Profile builders** aggregate event history into per-user profiles using identity stitching. They run on a schedule and emit profiles to a destination.
  - name: Domains
    description: |-
      Custom ingestion domains.

      Custom domains registered in a workspace, used as ingestion endpoints for streams.
  - name: Notifications
    description: |-
      Where account alerts go.

      Subscriptions that deliver workspace alerts (sync failures, batch failures, dead-letter events) to email or Slack.
  - name: Warehouse
    description: Warehouse connections and the models built on top of them.
  - name: Monitoring
    description: Delivery errors, error statistics and queue health.
  - name: Trash
    description: Soft-deleted resources and the window in which they can be restored.
  - name: Secrets
    description: Credentials a destination or connector needs, stored by the backend and never returned in full.
  - name: Authorizations
    description: OAuth grants that let the backend pull from a third-party account on the customer's behalf.
  - name: API tokens
    description: Programmatic access to this API for an account.
  - name: Health
    description: Liveness, readiness and build identity. Unversioned and unauthenticated.
paths:
  '/healthz':
    get:
      tags:
        - Health
      summary: Liveness probe
      description: |-
        Whether the process is up. Says nothing about whether an account's data is flowing — that is `/v1/accounts/{account_id}/health`.
      operationId: healthz_healthz_get
      x-sfere-status: shipped
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthz Healthz Get
      security: []
  '/readyz':
    get:
      tags:
        - Health
      summary: Readiness probe
      description: Whether the service can serve traffic, dependencies included.
      operationId: readyz_readyz_get
      x-sfere-status: shipped
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Readyz Readyz Get
      security: []
  '/v1/accounts':
    post:
      tags:
        - Accounts
      summary: Create an account
      description: |-
        Registration already creates the caller's first account, so this is for additional ones — an agency running several brands, or a customer separating staging from production data.
      operationId: createAccount
      x-sfere-status: shipped
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 255
                pattern: '^[A-Za-z0-9._-]+$'
              - type: 'null'
            description: Client-generated key making this POST safely retryable.
            title: Idempotency-Key
          description: Client-generated key making this POST safely retryable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Account'
        '400':
          description: Malformed request body
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '401':
          description: Missing or invalid credentials
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '409':
          description: Conflicts with existing state
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
      security:
        - HTTPBearer: []
    get:
      tags:
        - Accounts
      summary: List accounts
      description: Accounts the caller is a member of.
      operationId: listAccounts
      x-sfere-status: shipped
      x-jitsu-equivalent: GET /api/workspace
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: Page number
            default: 1
            title: Page
          description: Page number
        - name: size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Page size
            default: 50
            title: Size
          description: Page size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Page_Account_'
        '401':
          description: Missing or invalid credentials
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
      security:
        - HTTPBearer: []
  '/v1/accounts/{account_id}':
    get:
      tags:
        - Accounts
      summary: Get an account
      description: |-
        An account is the tenancy boundary for everything in this contract. `jitsu_workspace_id` is the workspace the backend provisions behind it — it is exposed for support and debugging, not for the dashboard to call.
      operationId: getAccount
      x-sfere-status: shipped
      x-jitsu-equivalent: 'GET /api/workspace/{workspaceIdOrSlug}'
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Account'
        '401':
          description: Missing or invalid credentials
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '403':
          description: Authenticated but not permitted
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
      security:
        - HTTPBearer: []
  '/v1/accounts/{account_id}/api-tokens':
    get:
      tags:
        - API tokens
      summary: List API tokens
      description: |-
        Metadata only — a token's plaintext exists in exactly one response, the create. Use `last_used_at` to find tokens nothing is using before revoking them.
      operationId: listApiTokens
      x-sfere-status: proposed
      security:
        - HTTPBearer: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          description: The account that owns this resource.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, from 1.
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Page_ApiToken_'
        '400':
          description: Malformed request
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '401':
          description: Missing or invalid credentials
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '403':
          description: Authenticated but not permitted
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
    post:
      tags:
        - API tokens
      summary: Create an API token
      description: |-
        The only response carrying the plaintext token. Scopes cannot exceed the creating member's role, so a viewer cannot mint themselves a write token.
      operationId: createApiToken
      x-sfere-status: proposed
      security:
        - HTTPBearer: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          description: The account that owns this resource.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[A-Za-z0-9._-]+$'
          description: Retry-safe key. Required in practice for any create that provisions infrastructure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/ApiTokenCreate'
      responses:
        '201':
          description: 'Created — contains the plaintext token, shown once'
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ApiTokenCreated'
        '400':
          description: Malformed request
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '401':
          description: Missing or invalid credentials
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '403':
          description: Authenticated but not permitted
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
  '/v1/accounts/{account_id}/api-tokens/{api_token_id}':
    delete:
      tags:
        - API tokens
      summary: Revoke an API token
      description: |-
        Takes effect immediately; anything still authenticating with it starts getting 401s. There is no un-revoke.
      operationId: revokeApiToken
      x-sfere-status: proposed
      security:
        - HTTPBearer: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          description: The account that owns this resource.
        - name: api_token_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: Malformed request
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '401':
          description: Missing or invalid credentials
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '403':
          description: Authenticated but not permitted
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
  '/v1/accounts/{account_id}/connector-images':
    get:
      tags:
        - Connectors
      summary: List custom connector images
      description: |-
        Customer-supplied connector images, for a source the catalog does not cover. Account-scoped because an image is the account's, not the platform's.
      operationId: listConnectorImages
      x-sfere-status: proposed
      x-jitsu-equivalent: 'GET /api/{workspaceId}/config/custom-image'
      security:
        - HTTPBearer: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          description: The account that owns this resource.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, from 1.
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Page_ConnectorImage_'
        '400':
          description: Malformed request
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '401':
          description: Missing or invalid credentials
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '403':
          description: Authenticated but not permitted
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
    post:
      tags:
        - Connectors
      summary: Register a custom connector image
      description: |-
        The backend pulls the image asynchronously, so the response comes back `pending`; poll until it is `ready` or `failed`. Registry credentials are write-only.
      operationId: createConnectorImage
      x-sfere-status: proposed
      x-jitsu-equivalent: 'POST /api/{workspaceId}/config/custom-image'
      security:
        - HTTPBearer: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          description: The account that owns this resource.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[A-Za-z0-9._-]+$'
          description: Retry-safe key. Required in practice for any create that provisions infrastructure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/ConnectorImageCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ConnectorImage'
        '400':
          description: Malformed request
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '401':
          description: Missing or invalid credentials
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '403':
          description: Authenticated but not permitted
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '409':
          description: Already exists
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
  '/v1/accounts/{account_id}/connector-images/{connector_image_id}':
    delete:
      tags:
        - Connectors
      summary: Remove a custom connector image
      description: 'Refused while a source still runs on this image — detach or delete those sources first.'
      operationId: deleteConnectorImage
      x-sfere-status: proposed
      x-jitsu-equivalent: 'DELETE /api/{workspaceId}/config/custom-image/{id}'
      security:
        - HTTPBearer: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          description: The account that owns this resource.
        - name: connector_image_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: Malformed request
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '401':
          description: Missing or invalid credentials
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '403':
          description: Authenticated but not permitted
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '409':
          description: A source still uses this image
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
  '/v1/accounts/{account_id}/dashboard':
    get:
      tags:
        - Dashboard
      summary: Get the dashboard overview
      description: |-
        One aggregate call that feeds the whole home screen: totals, per-source and per-destination stats, and time buckets. `minutes` sizes the window (5–180).
      operationId: getDashboardOverview
      x-sfere-status: shipped
      x-jitsu-equivalent: 'GET /api/{workspaceId}/metrics'
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            title: Account Id
        - name: minutes
          in: query
          required: false
          schema:
            type: integer
            maximum: 180
            minimum: 5
            description: 'Window size in minutes; counts and buckets cover (now - minutes, now)'
            default: 60
            title: Minutes
          description: 'Window size in minutes; counts and buckets cover (now - minutes, now)'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/DashboardOverview'
        '401':
          description: Missing or invalid credentials
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '403':
          description: Authenticated but not permitted
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/Problem'
        '422':
