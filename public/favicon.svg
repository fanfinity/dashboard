<!-- Sfere mark, cut for a favicon.
     Same geometry as public/brand/sfere-mark.svg, with two changes forced by the
     16px case: the three faintest nodes (r=1.4 at 38% opacity) are dropped
     because they render as grey mush at tab size, and the viewBox is squared and
     tightened around what remains. Everything left is the sphere plus the two
     node columns that still read at 16px. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="6.66 0.95 36 36"
  fill="none"
  role="img"
  aria-label="Sfere"
>
  <circle cx="13.45" cy="31.69" r="2" fill="#9969FF" fill-opacity=".45" />
  <circle cx="9.91" cy="18.95" r="2" fill="#9969FF" fill-opacity=".45" />
  <circle cx="13.45" cy="6.21" r="2" fill="#9969FF" fill-opacity=".45" />
  <circle cx="20" cy="27.76" r="2.6" fill="#7C4DFF" />
  <circle cx="17.56" cy="18.95" r="2.6" fill="#7C4DFF" />
  <circle cx="20" cy="10.14" r="2.6" fill="#7C4DFF" />
  <circle cx="34.66" cy="18.95" r="6.75" fill="#9969FF" />
</svg>
